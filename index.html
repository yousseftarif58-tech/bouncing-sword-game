<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Bouncing Sword Duel</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        #setupPanel {
            margin-bottom: 15px;
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        input, button {
            padding: 10px;
            font-size: 14px;
            border-radius: 4px;
            border: none;
            margin: 5px;
        }
        input {
            background-color: #333;
            color: white;
            width: 250px;
            text-align: center;
        }
        button {
            background-color: #4d94ff;
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #357ae8;
        }
        #scoreBoard {
            display: flex;
            gap: 40px;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .p1-score { color: #ff4d4d; }
        .p2-score { color: #4d94ff; }
        canvas {
            border: 4px solid #ffffff;
            background-color: #111111;
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        .controls {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="setupPanel">
        <div id="myIdDisplay" style="font-weight: bold; font-size: 16px; margin-bottom: 10px; color: #00ffcc;">Generating your Link ID...</div>
        <input type="text" id="peerIdInput" placeholder="Paste Friend's ID Here">
        <button id="connectBtn">Connect to Friend</button>
        <div id="status" style="color: #ffcc00; margin-top: 8px; font-size: 13px;">Connecting to matchmaking server...</div>
    </div>

    <div id="scoreBoard">
        <div class="p1-score">Player 1 (Red): <span id="p1Score">0</span> | HP: <span id="p1Hp">10</span></div>
        <div class="p2-score">Player 2 (Blue): <span id="p2Score">0</span> | HP: <span id="p2Hp">10</span></div>
    </div>

    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <div class="controls">
        Use <b>A / D</b> or the <b>Left / Right Arrows</b> to spin your sword! <br>
        Smash your white sword tip into the opponent's body circle to deal damage.
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        // Game Settings
        const PLAYER_RADIUS = 20;
        const SWORD_LENGTH = 35;
        const MOVE_SPEED = 4;
        const ROTATION_SPEED = 0.08;

        // Key Listeners
        const keys = {};
        window.addEventListener("keydown", (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener("keyup", (e) => keys[e.key.toLowerCase()] = false);
        window.addEventListener("keydown", (e) => { if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault(); });

        let peer;
        let conn;
        let amIHost = false; 
        let isConnected = false;

        class Player {
            constructor(x, y, vx, vy, color) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.angle = 0;
                this.score = 0;
                this.hp = 10;
                this.cooldown = 0;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                // DVD Box Boundary Collisions
                if (this.x - PLAYER_RADIUS < 0) { this.x = PLAYER_RADIUS; this.vx *= -1; }
                if (this.x + PLAYER_RADIUS > canvas.width) { this.x = canvas.width - PLAYER_RADIUS; this.vx *= -1; }
                if (this.y - PLAYER_RADIUS < 0) { this.y = PLAYER_RADIUS; this.vy *= -1; }
                if (this.y + PLAYER_RADIUS > canvas.height) { this.y = canvas.height - PLAYER_RADIUS; this.vy *= -1; }

                if (this.cooldown > 0) this.cooldown--;
            }

            getSwordTip() {
                return {
                    x: this.x + Math.cos(this.angle) * (PLAYER_RADIUS + SWORD_LENGTH),
                    y: this.y + Math.sin(this.angle) * (PLAYER_RADIUS + SWORD_LENGTH)
                };
            }

            draw() {
                if (this.cooldown % 4 > 2) return; // Blinking effect when damaged
                
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // Draw Sword Steel
                ctx.strokeStyle = "#dddddd";
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(PLAYER_RADIUS, 0);
                ctx.lineTo(PLAYER_RADIUS + SWORD_LENGTH, 0);
                ctx.stroke();

                // Draw Sharp Blade Tip
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(PLAYER_RADIUS + SWORD_LENGTH, 0, 5, 0, Math.PI * 2);
                ctx.fill();

                // Draw Character Body
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(0, 0, PLAYER_RADIUS, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = "#ffffff";
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }
        }

        const player1 = new Player(150, 250, MOVE_SPEED, -MOVE_SPEED, "#ff4d4d");
        const player2 = new Player(650, 250, -MOVE_SPEED, MOVE_SPEED, "#4d94ff");

        function getDistance(x1, y1, x2, y2) { return Math.sqrt((x2 - x1)**2 + (y2 - y1)**2); }

        function checkCollisions() {
            if (!amIHost) return; // Host strictly syncs authority math

            const tip1 = player1.getSwordTip();
            const tip2 = player2.getSwordTip();

            // P1 deals damage to P2
            if (player2.cooldown === 0 && getDistance(tip1.x, tip1.y, player2.x, player2.y) < PLAYER_RADIUS) {
                player1.score++; player2.hp--; player2.cooldown = 40;
                bouncePlayers(player1, player2);
                return;
            }
            // P2 deals damage to P1
            if (player1.cooldown === 0 && getDistance(tip2.x, tip2.y, player1.x, player1.y) < PLAYER_RADIUS) {
                player2.score++; player1.hp--; player1.cooldown = 40;
                bouncePlayers(player2, player1);
                return;
            }
            // Basic body-to-body bumping
            if (getDistance(player1.x, player1.y, player2.x, player2.y) < PLAYER_RADIUS * 2) {
                bouncePlayers(player1, player2);
            }
        }

        function bouncePlayers(p1, p2) {
            const tempX = p1.vx; const tempY = p1.vy;
            p1.vx = p2.vx; p1.vy = p2.vy;
            p2.vx = tempX; p2.vy = tempY;
            // Separate bodies instantly to prevent locking
            p1.x += p1.vx * 2; p1.y += p1.vy * 2;
            p2.x += p2.vx * 2; p2.y += p2.vy * 2;
        }

        // --- FIXED SECURE PEERJS CONFIGURATION ---
        peer = new Peer(undefined, {
            host: '0.peerjs.com',
            port: 443,
            path: '/',
            secure: true
        });

        peer.on('open', (id) => {
            document.getElementById("myIdDisplay").innerText = "Your ID: " + id;
            document.getElementById("status").innerText = "Ready. Give your ID to your friend!";
        });

        peer.on('error', (err) => {
            console.error(err);
            document.getElementById("status").innerText = "Error: " + err.type;
        });

        // Setup Event Receivers
        peer.on('connection', (connection) => {
            conn = connection;
            amIHost = true;
            setupNetworkEvents();
        });

        document.getElementById("connectBtn").addEventListener("click", () => {
            const peerId = document.getElementById("peerIdInput").value.trim();
            if(!peerId) return alert("Please type your friend's ID first!");
            conn = peer.connect(peerId);
            amIHost = false;
            setupNetworkEvents();
        });

        function setupNetworkEvents() {
            document.getElementById("status").innerText = "Connecting to peer...";
            
            conn.on('open', () => {
                isConnected = true;
                document.getElementById("setupPanel").style.display = "none";
            });

            conn.on('data', (data) => {
                if (amIHost) {
                    player2.angle = data.angle;
                } else {
                    player1.x = data.p1.x; player1.y = data.p1.y; player1.angle = data.p1.angle;
                    player2.x = data.p2.x; player2.y = data.p2.y; player2.angle = data.p2.angle;
                    player1.score = data.p1.score; player1.hp = data.p1.hp;
                    player2.score = data.p2.score; player2.hp = data.p2.hp;
                    player1.cooldown = data.p1.cooldown; player2.cooldown = data.p2.cooldown;
                }
            });

            conn.on('close', () => {
                alert("Player disconnected!");
                location.reload();
            });
        }

        function updateGame() {
            if (!isConnected) return;

            if (amIHost) {
                if (keys["a"] || keys["arrowleft"]) player1.angle -= ROTATION_SPEED;
                if (keys["d"] || keys["arrowright"]) player1.angle += ROTATION_SPEED;

                player1.update();
                player2.update();
                checkCollisions();

                conn.send({
                    p1: { x: player1.x, y: player1.y, angle: player1.angle, score: player1.score, hp: player1.hp, cooldown: player1.cooldown },
                    p2: { x: player2.x, y: player2.y, angle: player2.angle, score: player2.score, hp: player2.hp, cooldown: player2.cooldown }
                });
            } else {
                if (keys["a"] || keys["arrowleft"]) player2.angle -= ROTATION_SPEED;
                if (keys["d"] || keys["arrowright"]) player2.angle += ROTATION_SPEED;

                conn.send({ angle: player2.angle });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!isConnected) {
                ctx.fillStyle = "#888888";
                ctx.font = "22px sans-serif";
                ctx.textAlign = "center";
                ctx.fillText("Waiting for players to bridge connections...", canvas.width/2, canvas.height/2);
                return;
            }

            player1.draw();
            player2.draw();
            
            document.getElementById("p1Score").innerText = player1.score;
            document.getElementById("p1Hp").innerText = player1.hp;
            document.getElementById("p2Score").innerText = player2.score;
            document.getElementById("p2Hp").innerText = player2.hp;
        }

        function gameLoop() {
            updateGame();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
